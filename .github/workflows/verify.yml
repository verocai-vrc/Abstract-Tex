# The loop gate on every platform we ship to (SPRINTS.md §1, rungs 1–3; S2.8).
#
# One job, three runners. Each does what a developer does on a fresh machine, in the order
# README.md's "Building" section gives: install, fetch the engine, build the frontend, verify.
# The Tauri app crate is built too, because `tauri_build` insists the sidecar exists for the
# host triple and `generate_context!` insists `dist/` does — both of which only a full build
# exercises, and both of which have bitten a "tests pass locally" change before.

name: verify

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The engine's package cache. Keyed below so a warm CI run, like a warm laptop, does not
  # download the LaTeX bundle again.
  TECTONIC_CACHE_DIR: ${{ github.workspace }}/.tectonic-cache

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and friends: what Tauri 2 links against on Linux. The other two runners
      # ship their webview (WebView2, WKWebView) with the OS.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev pkg-config build-essential patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rust-toolchain.toml names the channel and components; this action only installs rustup
      # itself and lets that file decide the rest.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Cache the engine's LaTeX bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.TECTONIC_CACHE_DIR }}
          key: tectonic-0.17.0-${{ runner.os }}-${{ runner.arch }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-sidecars
      # `dist/` must exist before the app crate compiles — `generate_context!` embeds it.
      - run: pnpm build

      # Rungs 1 and 2, on every OS.
      - run: pnpm verify

      # Rung 3: a real build of fixtures/minimal with the engine just fetched.
      - name: Real engine build of a fixture
        run: cargo test -p abstract-tex-engine -- --ignored

      # The one thing `cargo test --workspace` does not prove: the app crate links as an app,
      # sidecar and all, on this OS.
      - run: cargo build -p abstract-tex
