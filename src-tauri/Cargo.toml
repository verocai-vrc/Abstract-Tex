[package]
name = "abstract-tex"
description = "A local-first LaTeX editor for people who write papers, not servers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Tauri wants the app as a library plus a thin binary (main.rs) so that mobile targets and
# tests can link the same code. We have no mobile target (DESIGN.md §1.3) but keep the shape.
[lib]
name = "abstract_tex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fake-git-lfs-installed"
path = "src/bin/fake_git_lfs_installed.rs"
test = false
doc = false

[[bin]]
name = "fake-git-lfs-missing"
path = "src/bin/fake_git_lfs_missing.rs"
test = false
doc = false

[[bin]]
name = "fake-git-lfs-track-fails"
path = "src/bin/fake_git_lfs_track_fails.rs"
test = false
doc = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` enables the asset:// protocol that serves the compiled PDF to pdf.js without
# pushing megabytes through JSON IPC (DESIGN.md §4.1, note 1).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# S10.4b: the one thing the webview cannot do for itself — open the person's own browser at
# github.com/login/device. A link with target="_blank" in a Tauri window goes nowhere.
tauri-plugin-opener = "2"

abstract-tex-engine = { path = "../crates/abstract-tex-engine" }
abstract-tex-git = { path = "../crates/abstract-tex-git" }
abstract-tex-github = { path = "../crates/abstract-tex-github" }
abstract-tex-latexdiff = { path = "../crates/abstract-tex-latexdiff" }
abstract-tex-snapshot = { path = "../crates/abstract-tex-snapshot" }
abstract-tex-includes = { path = "../crates/abstract-tex-includes" }
abstract-tex-lsp = { path = "../crates/abstract-tex-lsp" }
abstract-tex-reconcile = { path = "../crates/abstract-tex-reconcile" }
abstract-tex-synctex = { path = "../crates/abstract-tex-synctex" }
abstract-tex-templates = { path = "../crates/abstract-tex-templates" }
texbib = { path = "../crates/texbib", features = ["acquire"] }
texlog = { path = "../crates/texlog" }

tokio = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Only to build fixture commits in `latexdiff.rs`'s tests (a signature, an index) — the app
# itself reaches Git through abstract-tex-git alone.
git2 = { version = "0.20", default-features = false }
# The tests implement `Engine` with a fake, which needs the same macro the trait uses.
async-trait = { workspace = true }
# The SyncTeX test relocates the committed fixture to this checkout's path and re-gzips it.
flate2 = { workspace = true }
