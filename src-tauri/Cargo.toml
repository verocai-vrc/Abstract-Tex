[package]
name = "preamble"
description = "A local-first LaTeX editor for people who write papers, not servers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Tauri wants the app as a library plus a thin binary (main.rs) so that mobile targets and
# tests can link the same code. We have no mobile target (DESIGN.md §1.3) but keep the shape.
[lib]
name = "preamble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` enables the asset:// protocol that serves the compiled PDF to pdf.js without
# pushing megabytes through JSON IPC (DESIGN.md §4.1, note 1).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

preamble-engine = { path = "../crates/preamble-engine" }
preamble-includes = { path = "../crates/preamble-includes" }
preamble-lsp = { path = "../crates/preamble-lsp" }
preamble-reconcile = { path = "../crates/preamble-reconcile" }
preamble-synctex = { path = "../crates/preamble-synctex" }
texlog = { path = "../crates/texlog" }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The tests implement `Engine` with a fake, which needs the same macro the trait uses.
async-trait = { workspace = true }
