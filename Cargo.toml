# Workspace root. Each member is its own crate with its own Cargo.toml; this file only lists
# them and pins the dependency versions they share, so every crate compiles the same `serde`.
#
# Why a workspace and not one big crate: the engine wrapper, the reconciler and the log parser
# are all testable with `cargo test` and no window on screen. That is what keeps the agent loops
# in 0.1/SPRINTS.md fast. The Tauri app crate in src-tauri/ is the only one that links a GUI.

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/abstract-tex-sidecar",
    "crates/abstract-tex-engine",
    "crates/abstract-tex-git",
    "crates/abstract-tex-includes",
    "crates/abstract-tex-lsp",
    "crates/abstract-tex-reconcile",
    "crates/abstract-tex-snapshot",
    "crates/abstract-tex-synctex",
    "crates/texbib",
    "crates/texlog",
    "crates/texwords",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/verocai-vrc/Abstract-Tex"
rust-version = "1.80"

[workspace.dependencies]
# Async runtime. Tauri already depends on it, so the app pays nothing extra.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Serialisation for IPC payloads and abstract-tex.toml.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Error handling: `thiserror` for typed errors in libraries, `anyhow` at the app edge.
thiserror = "2"
anyhow = "1"
# Structured logging. Spans make the compile pipeline debuggable.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Text diffing for the external-change reconciler.
similar = "2"
# Property-based testing.
proptest = "1"
# Temporary directories in tests.
tempfile = "3"
# File watching.
notify = "8"
notify-debouncer-mini = "0.7"
# Trait objects with async methods (explained in crates/abstract-tex-engine/src/lib.rs).
async-trait = "0.1"
# Gzip decompression, for reading .synctex.gz (crates/abstract-tex-synctex). Widely used, actively
# maintained, part of the rust-lang-adjacent ecosystem — not a niche one-person crate.
flate2 = "1"
# HTTP client for the acquisition features (DESIGN.md §5.4: DOI, arXiv, ISBN, and later Zotero).
# `rustls-tls` avoids linking system OpenSSL, matching the "bundled, zero setup" story. The
# blocking client, not the async one: texbib is meant to be callable from a plain script with no
# async runtime (S8.5), so anything awaiting it wraps the call in `spawn_blocking` instead.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
# Smaller, faster binary; the bundle size argument in DESIGN.md §4 depends on it.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
