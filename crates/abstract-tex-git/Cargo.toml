[package]
name = "abstract-tex-git"
description = "The project's Git working tree and history, as the Source Control view needs them: status, stage, unstage, discard, commit, log, branch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# libgit2. `ssh` stays off, same reasons as crates/abstract-tex-snapshot: nothing in this app
# offers an SSH remote, and libssh2 is a library with nothing to link it in for. `https` is on
# (S11.1a) — this is now the one crate in the workspace whose job is talking to a remote. On
# Linux that needs the system OpenSSL dev headers (already installed for Tauri/WebKitGTK in CI
# and on a dev machine); on Windows and macOS it costs nothing extra, because libgit2-sys talks
# to WinHTTP and Secure Transport there instead.
git2 = { version = "0.20", default-features = false, features = ["https"] }
# These types cross to the frontend as they are, so they serialise here rather than being
# restated in src-tauri.
serde = { workspace = true }
thiserror = { workspace = true }
# For one constant: the ref S10.1 puts its snapshots on, so that `log` can leave it out of a
# row's tags rather than spelling `refs/abstract-tex/snapshots` a second time and drifting.
abstract-tex-snapshot = { path = "../abstract-tex-snapshot" }
# S10.3c: the word count behind the suggested commit message and each graph row's delta. A
# `.tex` line diff counts markup; a writer counts prose, and `texwords` is the only thing here
# that knows the difference. This crate still knows nothing about TeX itself.
texwords = { path = "../texwords" }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
