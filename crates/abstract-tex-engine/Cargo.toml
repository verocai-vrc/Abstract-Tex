[package]
name = "abstract-tex-engine"
description = "TeX engine abstraction for Abstract-Tex: probe an engine, run a build, cancel it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
abstract-tex-sidecar = { path = "../abstract-tex-sidecar" }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# tests/torture.rs (S6.4) runs the twenty-error torture document through the real engine and
# then through the rule catalog, so it needs texlog — as a test-only dependency: the engine
# itself never reads a log (lib.rs), and must not start to.
texlog = { path = "../texlog" }
# tests/corpus.rs (S9.1) compares the broken corpus document's diagnostics with expected.json.
serde_json = { workspace = true }
# tests/corpus.rs (S9.7) asks the include graph which chapter an edit is in, the way the app does.
abstract-tex-includes = { path = "../abstract-tex-includes" }
# tests/templates.rs (S11.10a) instantiates every starter template and builds it, so a template
# that does not compile is caught before an author's first PDF is the one that fails.
abstract-tex-templates = { path = "../abstract-tex-templates" }
