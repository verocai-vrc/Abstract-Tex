[package]
name = "preamble-engine"
description = "TeX engine abstraction for Preamble: probe an engine, run a build, cancel it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
preamble-sidecar = { path = "../preamble-sidecar" }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# tests/torture.rs (S6.4) runs the twenty-error torture document through the real engine and
# then through the rule catalog, so it needs texlog — as a test-only dependency: the engine
# itself never reads a log (lib.rs), and must not start to.
texlog = { path = "../texlog" }
